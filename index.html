<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="SET Mode – dein Trainingsplan mit automatischer Gewichtsanpassung und erklärten Übungen.">
  <meta name="application-name" content="SET Mode">
  <meta name="apple-mobile-web-app-title" content="SET Mode">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <title>SET Mode</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
  <script>
    /* SET Mode vor dem ersten Zeichnen anwenden (kein Aufblitzen des falschen Designs) */
    try { if (JSON.parse(localStorage.getItem('fitplan.v1')).settings.setMode === false) document.documentElement.dataset.setmode = 'off'; } catch (e) { }
  </script>
</head>
<body>
  <main id="app"></main>
  <div id="overlay"></div>
  <!-- Reihenfolge: Sprachkern → Sprachdateien → Daten → Animationen → Voiceover → App -->
  <script src="i18n.js"></script>
  <script src="lang/de.js"></script>
  <script src="lang/en.js"></script>
  <script src="lang/es.js"></script>
  <script src="lang/tr.js"></script>
  <script src="data.js"></script>
  <script src="anim.js"></script>
  <script src="voice.js"></script>
  <script src="app.js"></script>
</body>
</html>
